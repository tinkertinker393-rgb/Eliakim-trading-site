<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deriv Multi-Index Streamer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .price-up { color: #00a86b; animation: flash-green 0.5s; }
        .price-down { color: #ef4444; animation: flash-red 0.5s; }
        @keyframes flash-green { from { background: rgba(0, 168, 107, 0.2); } to { background: transparent; } }
        @keyframes flash-red { from { background: rgba(239, 68, 68, 0.2); } to { background: transparent; } }
        .index-card { transition: all 0.2s ease; border: 1px solid #e5e7eb; }
        .index-card:hover { transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <nav class="bg-[#0e2433] text-white p-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-4">
            <h1 class="text-xl font-bold tracking-tight">DERIV <span class="text-red-500">LIVE</span> FEED</h1>
            <span id="conn-status" class="text-[10px] bg-red-500 px-2 py-0.5 rounded-full uppercase font-bold">Offline</span>
        </div>
        <div class="text-right">
            <div id="balance-display" class="text-green-400 font-mono font-bold">Connecting...</div>
            <div id="account-id" class="text-[10px] text-gray-400">---</div>
        </div>
    </nav>

    <div class="p-6">
        <div class="mb-6 flex justify-between items-end">
            <div>
                <h2 class="text-2xl font-bold text-gray-800">Synthetic Indices</h2>
                <p class="text-gray-500 text-sm">Real-time tick data across all active derived markets.</p>
            </div>
            <div class="text-xs text-gray-400 italic">Auto-refreshing via WebSocket</div>
        </div>

        <div id="market-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
            <div class="col-span-full py-20 text-center text-gray-400">
                <div class="animate-spin inline-block w-8 h-8 border-4 border-current border-t-transparent text-blue-600 rounded-full mb-4"></div>
                <p>Fetching active market symbols...</p>
            </div>
        </div>
    </div>

    <script>
        const APP_ID = '119353';
        const TOKEN = 'sI05YqeXBucWOm1'; // Demo Token
        const marketGrid = document.getElementById('market-grid');
        let ws;
        const prices = {};

        function init() {
            ws = new WebSocket(`wss://ws.binaryws.com/websockets/v3?app_id=${APP_ID}`);

            ws.onopen = () => {
                document.getElementById('conn-status').innerText = "Online";
                document.getElementById('conn-status').classList.replace('bg-red-500', 'bg-green-500');
                ws.send(JSON.stringify({ authorize: TOKEN }));
            };

            ws.onmessage = (msg) => {
                const data = JSON.parse(msg.data);

                if (data.msg_type === 'authorize') {
                    document.getElementById('balance-display').innerText = `${data.authorize.balance} ${data.authorize.currency}`;
                    document.getElementById('account-id').innerText = data.authorize.loginid;
                    
                    // Step 1: Request all active symbols
                    ws.send(JSON.stringify({ active_symbols: "brief", product_type: "basic" }));
                }

                if (data.msg_type === 'active_symbols') {
                    marketGrid.innerHTML = ''; // Clear loader
                    // Filter for Synthetic Indices (Derived)
                    const indices = data.active_symbols.filter(s => s.market === 'synthetic_index');
                    
                    indices.forEach(symbol => {
                        createCard(symbol);
                        // Step 2: Subscribe to ticks for this symbol
                        ws.send(JSON.stringify({ ticks: symbol.symbol, subscribe: 1 }));
                    });
                }

                if (data.msg_type === 'tick') {
                    updatePrice(data.tick);
                }
            };
        }

        function createCard(s) {
            const card = document.createElement('div');
            card.id = `card-${s.symbol}`;
            card.className = "index-card bg-white p-4 rounded-lg shadow-sm flex flex-col justify-between h-32";
            card.innerHTML = `
                <div class="flex justify-between items-start">
                    <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">${s.symbol}</span>
                    <span class="bg-blue-50 text-blue-600 text-[9px] px-2 py-0.5 rounded font-bold">LIVE</span>
                </div>
                <div class="font-bold text-gray-700 text-sm truncate mb-1">${s.display_name}</div>
                <div id="price-${s.symbol}" class="text-xl font-mono font-bold text-gray-900 transition-colors">0.0000</div>
            `;
            marketGrid.appendChild(card);
        }

        function updatePrice(tick) {
            const el = document.getElementById(`price-${tick.symbol}`);
            if (!el) return;

            const oldPrice = prices[tick.symbol] || 0;
            const newPrice = tick.quote;
            
            el.innerText = newPrice;
            
            // Visual feedback for price movement
            el.classList.remove('price-up', 'price-down');
            if (newPrice > oldPrice) {
                el.classList.add('price-up');
            } else if (newPrice < oldPrice) {
                el.classList.add('price-down');
            }
            
            prices[tick.symbol] = newPrice;
        }

        init();
    </script>
</body>
</html>
